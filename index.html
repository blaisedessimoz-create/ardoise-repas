<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tous à Table !</title>

  <!-- Configuration PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tous à Table !">
  <meta name="theme-color" content="#161311">

  <!-- Bibliothèque PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-cream: #F2EFE9;
      --burgundy: #9E2A2B;
      --burgundy-hover: #7E2122;
      --ochre: #E08E2E;
      --charcoal: #161311;
      --card-bg: #FFFFFF;
      --border-color: #E2DDD5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--charcoal);
      padding: 12px;
      max-width: 1250px;
      margin: 0 auto;
    }

    /* En-tête épuré sans icône */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      gap: 8px;
    }

    .app-title-container {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--charcoal);
      line-height: 1.1;
      letter-spacing: -0.3px;
    }

    .sync-status {
      font-size: 0.75rem;
      font-weight: 600;
      color: #2E7D32;
      display: block;
      margin-top: 2px;
    }

    /* Barre de boutons compacte */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-nav {
      background-color: #E6E1D7;
      color: var(--charcoal);
      font-size: 1rem;
      padding: 8px 12px;
    }

    .btn-today {
      background-color: #E6E1D7;
      color: var(--charcoal);
      font-size: 0.85rem;
    }

    .btn-pdf {
      background-color: #2E7D32;
      color: #FFFFFF;
      font-size: 1.1rem;
      padding: 8px 10px;
    }

    .btn-primary {
      background-color: var(--burgundy);
      color: #FFFFFF;
      font-size: 0.85rem;
    }

    /* Bloc Semaine */
    .week-block {
      margin-bottom: 24px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    .week-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--burgundy);
      margin-bottom: 14px;
    }

    /* DESKTOP : Table en grille */
    .desktop-view {
      display: block;
    }

    .mobile-view {
      display: none;
    }

    .grid-table {
      display: grid;
      grid-template-columns: 75px repeat(7, 1fr);
      gap: 6px;
    }

    .grid-header {
      font-weight: bold;
      text-align: center;
      padding: 6px;
      background-color: var(--bg-cream);
      border-radius: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .day-header .date-num {
      font-size: 1rem;
      font-weight: 800;
      color: var(--charcoal);
    }

    .day-header.today {
      background-color: var(--ochre);
      color: white;
    }

    .day-header.today .date-num {
      color: white;
    }

    .row-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      border-radius: 6px;
      color: white;
      text-transform: uppercase;
    }

    .row-midi { background-color: var(--ochre); }
    .row-soir { background-color: var(--burgundy); }
    .row-notes { background-color: var(--charcoal); }

    .cell {
      min-height: 140px;
      background: #FAFAFA;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
    }

    .cell.today-cell {
      border: 2px solid var(--ochre);
      background-color: #FFFDF9;
    }

    textarea {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 0.82rem;
      line-height: 1.3;
      color: var(--charcoal);
    }

    textarea::placeholder {
      color: #B0A8A0;
      font-size: 0.8rem;
    }

    .cell-notes {
      min-height: 55px;
    }

    .static-text-val {
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8rem;
      line-height: 1.3;
      color: #000000;
    }

    /* MOBILE : Vue avec étiquettes verticales (-90°) */
    @media (max-width: 768px) {
      body {
        padding: 6px;
      }

      .desktop-view {
        display: none;
      }

      .mobile-view {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .mobile-day-block {
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
        scroll-margin-top: 10px;
      }

      .mobile-day-block:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .mobile-day-title {
        font-weight: 800;
        font-size: 0.95rem;
        margin-bottom: 8px;
        color: var(--charcoal);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .mobile-day-title.today-title {
        color: var(--ochre);
      }

      .mobile-day-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .mobile-row {
        display: flex;
        align-items: stretch;
        gap: 6px;
      }

      .mobile-label-vert {
        width: 30px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        position: relative;
        overflow: hidden;
      }

      .mobile-label-vert span {
        transform: rotate(-90deg);
        white-space: nowrap;
        font-size: 0.7rem;
        font-weight: 800;
        color: white;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .mobile-input-container {
        flex-grow: 1;
        background: #FAFAFA;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 8px;
      }

      .mobile-input-container.today-input {
        border: 1px solid var(--ochre);
        background: #FFFDF9;
      }

      .mobile-input-container textarea {
        min-height: 90px;
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .mobile-input-container.notes-input textarea {
        min-height: 45px;
      }

      header h1 {
        font-size: 1.2rem;
      }
    }

    /* Mode PDF d'impression : Rendu épuré, zéro scrollbar */
    .pdf-clean-mode {
      background: #FFFFFF !important;
      color: #000000 !important;
      border: 1px solid #000000 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 10px !important;
      width: 100% !important;
    }

    .pdf-clean-mode .week-header {
      color: #000000 !important;
      font-size: 1.1rem !important;
      margin-bottom: 12px !important;
    }

    .pdf-clean-mode .grid-header,
    .pdf-clean-mode .row-label,
    .pdf-clean-mode .cell {
      background: #FFFFFF !important;
      color: #000000 !important;
      border: 1px solid #000000 !important;
      border-radius: 0 !important;
    }

    .pdf-clean-mode .cell {
      min-height: 170px !important;
      padding: 6px !important;
    }

    .pdf-clean-mode .cell-notes {
      min-height: 60px !important;
    }

    .pdf-clean-mode textarea {
      display: none !important;
    }

    .pdf-clean-mode .static-text-val {
      display: block !important;
      font-size: 0.82rem !important;
      line-height: 1.3 !important;
    }

    @media print {
      body {
        background-color: #FFFFFF !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      header, .controls, button, .sync-status {
        display: none !important;
      }
      .desktop-view {
        display: block !important;
      }
      .mobile-view {
        display: none !important;
      }
      .week-block {
        box-shadow: none !important;
        border: 1px solid #000000 !important;
        page-break-inside: avoid;
        margin-bottom: 20px !important;
        background: #FFFFFF !important;
        padding: 10px !important;
      }
      .cell {
        min-height: 170px !important;
      }
      textarea {
        display: none !important;
      }
      .static-text-val {
        display: block !important;
      }
      .week-header, .grid-header, .row-label, .cell {
        background: #FFFFFF !important;
        color: #000000 !important;
        border-color: #000000 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title-container">
      <h1>Tous à Table !</h1>
      <span id="sync-status" class="sync-status">🔄 Chargement...</span>
    </div>
    <div class="controls">
      <button class="btn-nav" onclick="changeWeek(-1)" title="Semaine précédente">«</button>
      <button class="btn-today" onclick="resetToCurrentWeek()">Aujourd'hui</button>
      <button class="btn-nav" onclick="changeWeek(1)" title="Semaine suivante">»</button>
      <button class="btn-pdf" onclick="exportToPDF()" title="Télécharger le PDF">📄</button>
      <button class="btn-primary" onclick="window.print()">🖨️ Imprimer</button>
    </div>
  </header>

  <main id="app-container">
    <!-- Contenu injecté dynamiquement -->
  </main>

  <script>
    const NPOINT_URL = "https://api.npoint.io/28a88f1381fa2b45b752";
    let currentDate = new Date();
    let mealsData = {};
    let saveTimeout = null;

    const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
    const DAYS_SHORT = ['LUN', 'MAR', 'MER', 'JEU', 'VEN', 'SAM', 'DIM'];

    function updateSyncStatus(status, isError = false) {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) {
        statusEl.textContent = status;
        statusEl.style.color = isError ? '#9E2A2B' : '#2E7D32';
      }
    }

    async function loadCloudData() {
      updateSyncStatus("🔄 Chargement...");
      try {
        const res = await fetch(NPOINT_URL, { cache: 'no-cache' });
        if (res.ok) {
          const data = await res.json();
          mealsData = data || {};
          localStorage.setItem('ardoise_meals', JSON.stringify(mealsData));
          updateSyncStatus("🟢 Synchronisé");
          renderApp();
          scrollToToday();
        } else {
          throw new Error("Erreur cloud");
        }
      } catch (err) {
        console.warn("Mode hors-ligne", err);
        const local = localStorage.getItem('ardoise_meals');
        if (local) mealsData = JSON.parse(local);
        updateSyncStatus("🟧 Mode local", true);
        renderApp();
        scrollToToday();
      }
    }

    async function saveCloudData() {
      updateSyncStatus("💾 Enregistrement...");
      localStorage.setItem('ardoise_meals', JSON.stringify(mealsData));

      try {
        const res = await fetch(NPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(mealsData)
        });
        if (res.ok) {
          updateSyncStatus("🟢 Synchronisé");
        } else {
          throw new Error("Erreur de sauvegarde");
        }
      } catch (err) {
        console.error("Erreur synchro cloud", err);
        updateSyncStatus("⚠️ Erreur de synchro", true);
      }
    }

    function getMonday(d) {
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function getWeekNumber(d) {
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const dayNr = (target.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
      }
      return 1 + Math.round((firstThursday - target.valueOf()) / 604800000);
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isToday(date) {
      const today = new Date();
      return date.getDate() === today.getDate() &&
        date.getMonth() === today.getMonth() &&
        date.getFullYear() === today.getFullYear();
    }

    function scrollToToday() {
      setTimeout(() => {
        const todayEl = document.getElementById('today-mobile-target');
        if (todayEl) {
          todayEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 200);
    }

    function renderWeek(mondayDate, isFirstWeek = false) {
      const monday = new Date(mondayDate);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const weekNum = getWeekNumber(monday);

      const dateRangeStr = `Semaine ${weekNum} : ${monday.getDate()} ${monday.toLocaleDateString('fr-FR', {month: 'short'})} – ${sunday.getDate()} ${sunday.toLocaleDateString('fr-FR', {month: 'short'})}`;
      const blockId = isFirstWeek ? 'current-week-pdf-block' : '';

      let html = `
        <div class="week-block" ${blockId ? `id="${blockId}"` : ''}>
          <div class="week-header">
            📅 ${dateRangeStr}
          </div>

          <!-- VUE DESKTOP (Grille) -->
          <div class="desktop-view">
            <div class="grid-table">
              <div class="grid-header">JOUR</div>
      `;

      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const todayClass = isToday(dayDate) ? 'today' : '';
        
        html += `
          <div class="grid-header day-header ${todayClass}">
            <span>${DAYS_SHORT[i]}</span>
            <span class="date-num">${dayDate.getDate()}</span>
          </div>
        `;
      }

      // Ligne MIDI Desktop
      html += `<div class="row-label row-midi">MIDI</div>`;
      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const key = `${formatDate(dayDate)}_midi`;
        const val = mealsData[key] || '';
        const todayCell = isToday(dayDate) ? 'today-cell' : '';

        html += `
          <div class="cell ${todayCell}">
            <textarea placeholder="+ Repas midi" data-key="${key}" oninput="handleInput(this)">${val}</textarea>
            <div class="static-text-val">${val}</div>
          </div>
        `;
      }

      // Ligne SOIR Desktop
      html += `<div class="row-label row-soir">SOIR</div>`;
      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const key = `${formatDate(dayDate)}_soir`;
        const val = mealsData[key] || '';
        const todayCell = isToday(dayDate) ? 'today-cell' : '';

        html += `
          <div class="cell ${todayCell}">
            <textarea placeholder="+ Repas soir" data-key="${key}" oninput="handleInput(this)">${val}</textarea>
            <div class="static-text-val">${val}</div>
          </div>
        `;
      }

      // Ligne NOTES Desktop
      html += `<div class="row-label row-notes">NOTES</div>`;
      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const key = `${formatDate(dayDate)}_notes`;
        const val = mealsData[key] || '';
        const todayCell = isToday(dayDate) ? 'today-cell' : '';

        html += `
          <div class="cell cell-notes ${todayCell}">
            <textarea placeholder="Note..." data-key="${key}" oninput="handleInput(this)">${val}</textarea>
            <div class="static-text-val">${val}</div>
          </div>
        `;
      }

      html += `
            </div>
          </div>

          <!-- VUE MOBILE -->
          <div class="mobile-view">
      `;

      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const todayTitleClass = isToday(dayDate) ? 'today-title' : '';
        const todayInputClass = isToday(dayDate) ? 'today-input' : '';
        const todayTargetId = isToday(dayDate) ? 'id="today-mobile-target"' : '';
        const keyMidi = `${formatDate(dayDate)}_midi`;
        const keySoir = `${formatDate(dayDate)}_soir`;
        const keyNotes = `${formatDate(dayDate)}_notes`;

        html += `
          <div class="mobile-day-block" ${todayTargetId}>
            <div class="mobile-day-title ${todayTitleClass}">
              <span>${DAYS[i]} ${dayDate.getDate()} ${dayDate.toLocaleDateString('fr-FR', {month: 'short'})}</span>
              ${isToday(dayDate) ? '<span>• Aujourd\'hui</span>' : ''}
            </div>

            <div class="mobile-day-rows">
              <div class="mobile-row">
                <div class="mobile-label-vert row-midi"><span>MIDI</span></div>
                <div class="mobile-input-container ${todayInputClass}">
                  <textarea placeholder="+ Repas midi" data-key="${keyMidi}" oninput="handleInput(this)">${mealsData[keyMidi] || ''}</textarea>
                </div>
              </div>

              <div class="mobile-row">
                <div class="mobile-label-vert row-soir"><span>SOIR</span></div>
                <div class="mobile-input-container ${todayInputClass}">
                  <textarea placeholder="+ Repas soir" data-key="${keySoir}" oninput="handleInput(this)">${mealsData[keySoir] || ''}</textarea>
                </div>
              </div>

              <div class="mobile-row">
                <div class="mobile-label-vert row-notes"><span>NOTES</span></div>
                <div class="mobile-input-container notes-input ${todayInputClass}">
                  <textarea placeholder="Note du jour..." data-key="${keyNotes}" oninput="handleInput(this)">${mealsData[keyNotes] || ''}</textarea>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      html += `
          </div>
        </div>
      `;

      return html;
    }

    function renderApp() {
      const container = document.getElementById('app-container');
      const mondayCurrent = getMonday(currentDate);
      
      const mondayNext = new Date(mondayCurrent);
      mondayNext.setDate(mondayCurrent.getDate() + 7);

      container.innerHTML = 
        renderWeek(mondayCurrent, true) + 
        renderWeek(mondayNext, false);
    }

    function handleInput(textarea) {
      const key = textarea.getAttribute('data-key');
      const val = textarea.value;
      mealsData[key] = val;

      const parentCell = textarea.closest('.cell');
      if (parentCell) {
        const staticText = parentCell.querySelector('.static-text-val');
        if (staticText) staticText.textContent = val;
      }

      clearTimeout(saveTimeout);
      updateSyncStatus("✏️ Saisie...");
      saveTimeout = setTimeout(() => {
        saveCloudData();
      }, 800);
    }

    function changeWeek(direction) {
      currentDate.setDate(currentDate.getDate() + (direction * 7));
      renderApp();
    }

    function resetToCurrentWeek() {
      currentDate = new Date();
      renderApp();
      scrollToToday();
    }

    function exportToPDF() {
      updateSyncStatus("⏳ Génération PDF...");
      const monday = getMonday(currentDate);
      const element = document.getElementById('current-week-pdf-block');

      if (!element) return;

      const desktopView = element.querySelector('.desktop-view');
      const mobileView = element.querySelector('.mobile-view');
      
      if (desktopView) desktopView.style.display = 'block';
      if (mobileView) mobileView.style.display = 'none';
      element.classList.add('pdf-clean-mode');

      const opt = {
        margin:       4,
        filename:     `Tous_a_Table_${formatDate(monday)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.classList.remove('pdf-clean-mode');
        if (desktopView) desktopView.style.display = '';
        if (mobileView) mobileView.style.display = '';
        updateSyncStatus("🟢 Synchronisé");
      }).catch(err => {
        console.error('Erreur PDF:', err);
        element.classList.remove('pdf-clean-mode');
        if (desktopView) desktopView.style.display = '';
        if (mobileView) mobileView.style.display = '';
        updateSyncStatus("⚠️ Erreur PDF", true);
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    }

    loadCloudData();
  </script>
</body>
</html>
